<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Acesso rápido aos portais da ABA English Education.">
    <title>Links - ABA</title>
    <link rel="icon" type="image/png" href="Imagens/Icone barra superior ( Favicon ).png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="redesign.css?v=11">
</head>
<body>
    <div class="left-shape" aria-hidden="true"></div>
    <div class="decor decor-red-top" aria-hidden="true"></div>
    <div class="decor decor-blue-top" aria-hidden="true"></div>
    <div class="decor decor-red-bottom" aria-hidden="true"></div>
    <div class="decor decor-blue-bottom" aria-hidden="true"></div>

    <main class="page-shell">
        <section class="portal-panel" aria-labelledby="page-title">
            <h1 id="page-title" class="sr-only">Acessos ABA</h1>

            <nav class="portal-list" aria-label="Portais e serviços ABA">
                <a href="https://portalaluno.abaweb.org/FrameHTML/Web/App/Edu/PortaldoProfessor/#/login" target="_blank" rel="noopener noreferrer" class="portal-link btn-professor">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/TOTVS.svg" alt="" class="brand-icon brand-icon--monochrome brand-icon--totvs"></span>
                    <span class="portal-name">Portal do Professor</span>
                </a>

                <a href="https://portalrh.abaweb.org/FrameHTML/Web/App/RH/PortalMeuRH/#/login" target="_blank" rel="noopener noreferrer" class="portal-link btn-registro">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/TOTVS.svg" alt="" class="brand-icon brand-icon--totvs"></span>
                    <span class="portal-name">Registro de Ponto</span>
                </a>

                <a href="https://mee.macmillaneducation.com/?lang=en" target="_blank" rel="noopener noreferrer" class="portal-link btn-macmillan">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/MACMILLAN.svg" alt="" class="brand-icon brand-icon--monochrome brand-icon--macmillan"></span>
                    <span class="portal-name">Macmillan</span>
                </a>

                <a href="https://learn.eltngl.com/" target="_blank" rel="noopener noreferrer" class="portal-link btn-spark">
                    <span class="icon-slot" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/></svg></span>
                    <span class="portal-name">Spark</span>
                </a>

                <a href="https://abanet.abaweb.org" target="_blank" rel="noopener noreferrer" class="portal-link btn-abanet">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/ABANET.svg" alt="" class="brand-icon brand-icon--monochrome brand-icon--abanet"></span>
                    <span class="portal-name">ABA.net</span>
                </a>

                <a href="https://www.agendatellme.com.br/aba/Authentication/Login?returnUrl=%2Faba" target="_blank" rel="noopener noreferrer" class="portal-link btn-tellme">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/ABATELLME.svg" alt="" class="brand-icon brand-icon--monochrome brand-icon--abatellme"></span>
                    <span class="portal-name">ABA Tellme</span>
                </a>

                <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer" class="portal-link btn-gmail">
                    <span class="icon-slot" aria-hidden="true"><img src="Imagens/GMAIL.svg" alt="" class="brand-icon brand-icon--gmail"></span>
                    <span class="portal-name">Gmail</span>
                </a>
            </nav>

            <div class="logo-wrap">
                <img src="Imagens/logo aba.png" alt="ABA English Education" class="brand-logo">
            </div>

        </section>

        <section class="building-panel" aria-label="Unidades da ABA English Education">
            <img src="Imagens/predios.png" alt="Prédios das unidades ABA English Education" class="building-composition">
        </section>

        <footer class="site-footer">
            <p>&copy; <span id="current-year"></span> ABA English Education. Todos os direitos reservados.</p>
        </footer>
    </main>

    <script src="script.js?v=3"></script>
</body>
</html>
